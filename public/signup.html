<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sign Up | Auction Platform</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
	<div id="toast-container"></div>
	<section class="d-flex align-items-center justify-content-center min-vh-100 py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">
					<div class="text-center mb-4">
						<a href="index.html" class="text-decoration-none">
							<h2 class="fw-bold text-primary">Auction Management System</h2>
						</a>
						<p class="text-muted">Join our community and start bidding or selling today.</p>
					</div>
					<div class="card p-4 shadow-sm border-0">
						<div class="card-body">
							<h1 class="fs-4 fw-bold mb-4">Create Account</h1>
							<form method="POST" class="needs-validation" novalidate="" autocomplete="off">
								<div class="mb-3">
									<label class="form-label text-muted small fw-bold" for="name">Full Name</label>
									<input id="name" type="text" class="form-control shadow-none" name="name" required
										autofocus placeholder="John Doe">
								</div>

								<div class="mb-3">
									<label class="form-label text-muted small fw-bold" for="email">E-Mail
										Address</label>
									<input id="email" type="email" class="form-control shadow-none" name="email"
										required placeholder="name@example.com">
								</div>

								<div class="mb-3">
									<label class="form-label text-muted small fw-bold" for="password">Password</label>
									<input id="password" type="password" class="form-control shadow-none"
										name="password" required placeholder="••••••••">
								</div>

								<div class="mb-4">
									<label class="form-label text-muted small fw-bold">Role</label>
									<select class="form-select shadow-none" required>
										<option value="" disabled selected>Select your role</option>
										<option value="1">Seller</option>
										<option value="2">Bidder</option>
									</select>
								</div>

								<div class="d-grid gap-2 mt-4">
									<button type="submit" class="btn btn-primary py-2 shadow-sm">
										Register
									</button>
								</div>
							</form>
						</div>
						<div class="card-footer bg-white border-0 text-center py-3">
							Already have an account? <a href="login.html"
								class="text-primary fw-bold text-decoration-none">Login</a>
						</div>
					</div>
					<div class="text-center mt-5 text-muted small">
						Copyright &copy; 2026 &mdash; Auction Management System
					</div>
				</div>
			</div>
		</div>
	</section>

	<script>
		function showToast(message, type = 'success') {
			const container = document.getElementById('toast-container');
			const toast = document.createElement('div');
			toast.className = `custom-toast ${type}`;

			const icons = {
				success: 'bi-check-circle-fill',
				error: 'bi-exclamation-circle-fill',
				info: 'bi-info-circle-fill'
			};

			toast.innerHTML = `
				<div class="icon"><i class="bi ${icons[type]}"></i></div>
				<div class="message">${message}</div>
			`;

			container.appendChild(toast);

			setTimeout(() => {
				toast.style.animation = 'fadeOut 0.3s ease forwards';
				setTimeout(() => toast.remove(), 300);
			}, 3000);
		}

		document.querySelector('form').addEventListener('submit', async function (e) {
			e.preventDefault();

			const name = document.getElementById('name').value.trim();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			const roleSelect = document.querySelector('select');
			const role = roleSelect.value === "1" ? "seller" : roleSelect.value === "2" ? "bidder" : "";

			if (!role) {
				showToast("Please select a valid role", "error");
				return;
			}

			try {
				const res = await fetch('/api/auth/signup', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username: name, email, password, role })
				});

				const data = await res.json();

				if (res.ok) {
					showToast("Successfully registered! Redirecting to login...", "success");
					setTimeout(() => window.location.href = 'login.html', 1500);
				} else {
					showToast(data.message || 'Signup failed', "error");
				}
			} catch (err) {
				console.error("Error during signup:", err);
				showToast('Something went wrong. Please try again.', "error");
			}
		});
	</script>
</body>

</html>
