<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Auction Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h2 class="fw-bold text-primary">Auction Management System</h2>
          </a>
          <p class="text-muted">No worries, we'll send you reset instructions.</p>
        </div>
        <div class="card p-4">
          <div class="card-body">
            <h1 class="fs-4 fw-bold mb-4">Reset Password</h1>
            <form id="forgotForm">
              <div class="mb-3">
                <label for="email" class="form-label text-muted small">Registered Email</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com" />
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
              </div>
              <div id="message" class="mt-3 text-center small"></div>
            </form>
          </div>
          <div class="card-footer bg-white border-0 text-center py-3">
            <a href="login.html" class="text-primary fw-bold text-decoration-none small">Back to Login</a>
          </div>
        </div>
        <div class="text-center mt-5 text-muted small">
          Copyright &copy; 2026 &mdash; Auction Management System
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const messageDiv = document.getElementById('message');

      try {
        const res = await fetch('http://localhost:3000/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        messageDiv.innerHTML = `<span class="text-success">✅ ${data.message || "Check your email for reset link."}</span>`;
      } catch (err) {
        messageDiv.innerHTML = `<span class="text-danger">❌ ${err.message}</span>`;
      }
    });
  </script>
</body>

</html>
