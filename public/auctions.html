<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auctions | Auction Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
  <div id="toast-container"></div>
  <nav class="navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary fs-4" href="index.html">Auction Management System</a>
      <div class="d-flex align-items-center gap-3">
        <div id="user-info" class="d-none d-md-flex align-items-center gap-2">
          <span id="welcome-msg" class="text-muted small"></span>
          <span id="role-badges"></span>
        </div>
        <button id="add-auction-btn" class="btn btn-primary d-none">
          <i class="bi bi-plus-lg me-1"></i> New Auction
        </button>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <header class="mb-5 d-flex justify-content-between align-items-center">
      <div>
        <h1 class="fw-bold mb-1">Live Auctions</h1>
        <p class="text-muted">Discover unique items and place your bids.</p>
      </div>
    </header>

    <div id="auction-list" class="row g-4">
      <!-- Auctions will be injected here -->
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="auctionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <form id="auctionForm">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="auctionModalLabel">Create Auction</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Item Title</label>
              <input type="text" name="title" class="form-control" placeholder="e.g. Vintage Camera" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Description</label>
              <textarea name="description" class="form-control" rows="3" placeholder="Tell us about the item..."
                required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold text-muted">Starting Price ($)</label>
                <input type="number" name="startPrice" class="form-control" placeholder="0.00" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold text-muted">End Time</label>
                <input type="datetime-local" name="endTime" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Product Image</label>
              <input type="file" name="images" id="imageInput" class="form-control mb-2" accept="image/*" multiple>
              <div id="imagePreview" class="row g-2 mt-2 d-none">
                <!-- Previews will go here -->
              </div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button type="submit" id="submitBtn" class="btn btn-primary px-4 w-100">
              <span id="btnText">Publish Auction</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `custom-toast ${type}`;
      const icons = { success: 'bi-check-circle-fill', error: 'bi-exclamation-circle-fill', info: 'bi-info-circle-fill' };
      toast.innerHTML = `<div class="icon"><i class="bi ${icons[type]}"></i></div><div class="message">${message}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const user = parseJwt(token);
      const roles = user.role || '';
      let editingAuctionId = null;

      // Initialize UI
      document.getElementById('welcome-msg').textContent = `Hello, ${user.username}`;
      const roleBadges = document.getElementById('role-badges');
      if (roles.includes('seller')) {
        roleBadges.innerHTML += '<span class="badge bg-primary me-1">Seller</span>';
      }
      if (roles.includes('bidder')) {
        roleBadges.innerHTML += '<span class="badge bg-warning text-dark">Bidder</span>';
      }

      const addBtn = document.getElementById('add-auction-btn');
      const modal = new bootstrap.Modal(document.getElementById('auctionModal'));
      const form = document.getElementById('auctionForm');

      if (roles.includes('seller')) {
        addBtn.classList.remove('d-none');
      }

      addBtn.addEventListener('click', () => {
        editingAuctionId = null;
        form.reset();
        document.getElementById('imagePreview').classList.add('d-none');
        document.getElementById('auctionModalLabel').textContent = 'Create Auction';

        // Set min date to now
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.querySelector('input[type="datetime-local"]').min = now.toISOString().slice(0, 16);

        modal.show();
      });

      document.getElementById('imageInput').addEventListener('change', function (e) {
        const previewGrid = document.getElementById('imagePreview');
        previewGrid.innerHTML = '';
        const files = Array.from(e.target.files);

        if (files.length > 0) {
          previewGrid.classList.remove('d-none');
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function (e) {
              const col = document.createElement('div');
              col.className = 'col-4';
              col.innerHTML = `
                <div class="position-relative">
                  <img src="${e.target.result}" class="img-fluid rounded border shadow-sm" style="height: 80px; width: 100%; object-fit: cover;">
                </div>
              `;
              previewGrid.appendChild(col);
            }
            reader.readAsDataURL(file);
          });
        } else {
          previewGrid.classList.add('d-none');
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Loading state
        submitBtn.disabled = true;
        btnText.textContent = editingAuctionId ? 'Updating...' : 'Publishing...';
        btnSpinner.classList.remove('d-none');

        const formData = new FormData(form);

        const url = editingAuctionId
          ? `/api/auctions/${editingAuctionId}/edit`
          : '/api/auctions/create';

        try {
          const res = await fetch(url, {
            method: editingAuctionId ? 'PUT' : 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: formData
          });

          const contentType = res.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
            const text = await res.text();
            console.error("Non-JSON response:", text);
            throw new Error("Server returned an unexpected response (non-JSON). Check console.");
          }

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Operation failed');

          modal.hide();
          showToast(editingAuctionId ? 'Auction updated!' : 'Auction created!', 'success');
          loadAuctions();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = editingAuctionId ? 'Update Auction' : 'Publish Auction';
          btnSpinner.classList.add('d-none');
        }
      });

      loadAuctions();

      async function loadAuctions() {
        try {
          const res = await fetch('/api/auctions', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          renderAuctions(data);
        } catch (err) {
          console.error('Failed to fetch auctions');
        }
      }

      function renderAuctions(auctions) {
        const list = document.getElementById('auction-list');
        list.innerHTML = '';

        if (auctions.length === 0) {
          list.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">No auctions available at the moment.</p></div>';
          return;
        }

        auctions.forEach(auction => {
          const highestBid = auction.bids?.length ? Math.max(...auction.bids.map(b => b.amount)) : auction.startPrice;
          const isSellerOfThis = auction.sellerId?._id === user.id;

          let timeStatus = '';
          if (auction.isOpen && auction.endTime) {
            timeStatus = `<span class="countdown timer" data-endtime="${auction.endTime}">Loading...</span>`;
          } else if (!auction.isOpen) {
            timeStatus = `<span class="badge bg-danger">Closed</span>`;
          }

          const card = document.createElement('div');
          card.className = 'col-md-6 col-lg-4';
          card.innerHTML = `
            <div class="card h-100 overflow-hidden">
              <div class="position-relative">
                <img src="${auction.image ? '' + auction.image : 'https://placehold.co/600x400?text=No+Image'}" 
                     class="card-img-top product-img" alt="${auction.title}">
                <div class="position-absolute top-0 end-0 p-2">
                  <span class="badge ${auction.isOpen ? 'bg-success' : 'bg-secondary'}">${auction.isOpen ? 'Active' : 'Ended'}</span>
                </div>
              </div>
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold mb-0">
                    <a href="auction-detail.html?id=${auction._id}" class="text-decoration-none text-dark">${auction.title}</a>
                  </h5>
                  <div class="text-end">
                    <small class="text-muted d-block">Current Bid</small>
                    <span class="fw-bold text-primary">$${highestBid}</span>
                  </div>
                </div>
                <p class="card-text text-muted small mb-3">${auction.description.substring(0, 100)}${auction.description.length > 100 ? '...' : ''}</p>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="small">
                    <i class="bi bi-person-circle text-muted"></i> ${auction.sellerId?.username || 'Seller'}
                  </div>
                  ${timeStatus}
                </div>

                ${!auction.isOpen && auction.winner ? `
                  <div class="bg-light p-2 rounded small mb-3 border">
                    <strong>Winner:</strong> ${auction.winner.username} ($${auction.winner.amount})
                  </div>
                ` : ''}

                ${auction.isOpen ? (roles.includes('bidder') ? `
                  <div class="input-group mb-2">
                    <input type="number" class="form-control form-control-sm bid-amount" placeholder="Min $${highestBid + 1}">
                    <button class="btn btn-primary btn-sm bid-btn" data-id="${auction._id}">Place Bid</button>
                  </div>
                ` : `
                  <div class="alert alert-light py-2 px-3 mb-2 small border-0 text-muted">
                    <i class="bi bi-info-circle me-1"></i> Only bidders can place bids.
                  </div>
                `) : ''}

                <div class="d-flex gap-2">
                  <a href="auction-detail.html?id=${auction._id}" class="btn btn-light btn-sm flex-grow-1">View Details</a>
                  ${auction.isOpen && (roles.includes('seller') && isSellerOfThis) ? `
                    <button class="btn btn-outline-danger btn-sm close-btn px-3" data-id="${auction._id}">Close</button>
                  ` : ''}
                  ${(roles.includes('seller') && isSellerOfThis) ? `
                    <button class="btn btn-outline-secondary btn-sm edit-btn" data-id="${auction._id}" 
                            data-title="${auction.title}" data-description="${auction.description}" 
                            data-price="${auction.startPrice}"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-outline-danger btn-sm delete-btn" data-id="${auction._id}"><i class="bi bi-trash"></i></button>
                  ` : ''}
                </div>
              </div>
            </div>
          `;

          list.appendChild(card);

          // Event Listeners for the card
          const editBtn = card.querySelector('.edit-btn');
          if (editBtn) {
            editBtn.addEventListener('click', () => {
              editingAuctionId = auction._id;
              document.getElementById('auctionModalLabel').textContent = 'Edit Auction';
              form.title.value = auction.title;
              form.description.value = auction.description;
              form.startPrice.value = auction.startPrice;
              modal.show();
            });
          }

          const deleteBtn = card.querySelector('.delete-btn');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', async () => {
              if (confirm('Delete this auction?')) {
                try {
                  const res = await fetch(`/api/auctions/${auction._id}`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${token}` }
                  });
                  if (res.ok) {
                    showToast('Auction deleted', 'success');
                    loadAuctions();
                  }
                } catch (err) { showToast('Delete failed', 'error'); }
              }
            });
          }

          const bidBtn = card.querySelector('.bid-btn');
          if (bidBtn) {
            bidBtn.addEventListener('click', async () => {
              const amount = card.querySelector('.bid-amount').value;
              if (!amount) return showToast('Enter a bid amount', 'error');
              try {
                const res = await fetch(`/api/auctions/${auction._id}/bid`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ amount })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);
                showToast('Bid placed successfully!', 'success');
                loadAuctions();
              } catch (err) { showToast(err.message, 'error'); }
            });
          }

          const closeBtn = card.querySelector('.close-btn');
          if (closeBtn) {
            closeBtn.addEventListener('click', async () => {
              try {
                const res = await fetch(`/api/auctions/${auction._id}/close`, {
                  method: 'PUT',
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                  showToast('Auction closed!', 'success');
                  loadAuctions();
                }
              } catch (err) { showToast('Close failed', 'error'); }
            });
          }
        });
      }

      // Global timer interval
      setInterval(() => {
        document.querySelectorAll('.timer').forEach(el => {
          const end = new Date(el.dataset.endtime).getTime();
          const now = new Date().getTime();
          const diff = end - now;
          if (diff <= 0) {
            el.innerHTML = '<span class="text-danger small">Ended</span>';
            el.classList.remove('timer');
          } else {
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            el.textContent = `${h}h ${m}m ${s}s`;
          }
        });
      }, 1000);

      function parseJwt(token) {
        try { return JSON.parse(atob(token.split('.')[1])); } catch { return {}; }
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      });
    });
  </script>

  <footer class="bg-white border-top py-4">
    <div class="container text-center text-muted small">
      Copyright &copy; 2026 &mdash; Auction Management System
    </div>
  </footer>
</body>

</html>
