<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Login | Auction Platform</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
	<div id="toast-container"></div>
	<section class="d-flex align-items-center justify-content-center min-vh-100">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">
					<div class="text-center mb-4">
						<a href="index.html" class="text-decoration-none">
							<h2 class="fw-bold text-primary">Auction Management System</h2>
						</a>
						<p class="text-muted">Welcome back! Please login to your account.</p>
					</div>
					<div class="card p-4 shadow-sm border-0">
						<div class="card-body">
							<h1 class="fs-4 fw-bold mb-4">Login</h1>
							<form method="POST" class="needs-validation" novalidate="" autocomplete="off">
								<div class="mb-3">
									<label class="form-label text-muted small fw-bold" for="email">E-Mail
										Address</label>
									<input id="email" type="email" class="form-control shadow-none" name="email"
										required autofocus placeholder="name@example.com">
								</div>

								<div class="mb-3">
									<label class="text-muted small fw-bold" for="password">Password</label>
									<input id="password" type="password" class="form-control shadow-none"
										name="password" required placeholder="••••••••">
								</div>

								<div class="d-grid gap-2 mt-4">
									<button type="submit" class="btn btn-primary py-2 shadow-sm">
										Sign In
									</button>
								</div>
							</form>
						</div>
						<div class="card-footer bg-white border-0 text-center py-3">
							Don't have an account? <a href="signup.html"
								class="text-primary fw-600 fw-bold text-decoration-none">Create One</a>
						</div>
					</div>
					<div class="text-center mt-5 text-muted small">
						Copyright &copy; 2026 &mdash; Auction Management System
					</div>
				</div>
			</div>
		</div>
	</section>

	<script>
		function showToast(message, type = 'success') {
			const container = document.getElementById('toast-container');
			const toast = document.createElement('div');
			toast.className = `custom-toast ${type}`;

			const icons = {
				success: 'bi-check-circle-fill',
				error: 'bi-exclamation-circle-fill',
				info: 'bi-info-circle-fill'
			};

			toast.innerHTML = `
				<div class="icon"><i class="bi ${icons[type]}"></i></div>
				<div class="message">${message}</div>
			`;

			container.appendChild(toast);

			setTimeout(() => {
				toast.style.animation = 'fadeOut 0.3s ease forwards';
				setTimeout(() => toast.remove(), 300);
			}, 3000);
		}

		document.querySelector('form').addEventListener('submit', async function (e) {
			e.preventDefault();

			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;

			if (!email || !password) {
				showToast('Please fill in both fields', 'error');
				return;
			}

			try {
				const res = await fetch('/api/auth/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, password })
				});

				const data = await res.json();

				if (res.ok) {
					localStorage.setItem('token', data.token);
					showToast('Login successful! Redirecting...', 'success');
					setTimeout(() => window.location.href = 'auctions.html', 1000);
				} else {
					showToast(data.message || 'Login failed', 'error');
				}

			} catch (err) {
				console.error(err);
				showToast('Something went wrong. Please try again later.', 'error');
			}
		});
	</script>
</body>

</html>
